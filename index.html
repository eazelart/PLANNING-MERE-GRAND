<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planning">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#ffffff; --fg:#1b1b1b; --accent:#1f4e79; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eaeaea; } }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
               font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #cal { position:fixed; inset:0; width:100%; height:100%; border:0; }

  .bar { position:fixed; left:0; right:0; bottom:0; z-index:10; display:none;
         align-items:center; gap:12px;
         background:var(--accent); color:#fff;
         padding:14px 16px calc(14px + env(safe-area-inset-bottom));
         font-size:15px; line-height:1.35;
         box-shadow:0 -2px 10px rgba(0,0,0,.25); }
  .bar.show { display:flex; }
  .bar .txt { flex:1; }
  .bar b { font-weight:600; }
  .bar button { flex:none; border:0; border-radius:8px; padding:10px 14px;
                font-size:15px; font-family:inherit; }
  .bar .go    { background:#fff; color:var(--accent); font-weight:600; }
  .bar .close { background:rgba(255,255,255,.18); color:#fff; }
</style>
</head>
<body>

<iframe id="cal" title="Planning des visites" src="about:blank"
        frameborder="0" scrolling="no"></iframe>

<noscript>
  <iframe style="position:fixed;inset:0;width:100%;height:100%;border:0"
    src="https://calendar.google.com/calendar/embed?src=azelartmarie%40gmail.com&amp;ctz=Europe%2FParis&amp;wkst=2&amp;mode=MONTH&amp;showTitle=0&amp;showPrint=0&amp;showTabs=0&amp;showCalendars=0&amp;showTz=0"></iframe>
</noscript>

<!-- Android : bandeau d'installation en un tap -->
<div class="bar" id="barAndroid">
  <span class="txt">Garder le planning sur l'écran d'accueil&nbsp;?</span>
  <button type="button" class="go"    id="btnInstall">Installer</button>
  <button type="button" class="close" id="btnNoAndroid">Non</button>
</div>

<!-- iPhone / iPad : Apple n'autorise pas l'installation en un tap -->
<div class="bar" id="barIOS">
  <span class="txt">Pour garder le planning&nbsp;: <b>Partager</b> puis <b>Sur l'écran d'accueil</b>.</span>
  <button type="button" class="close" id="btnNoIOS">OK</button>
</div>

<script>
(function () {

  // ---- Agenda affiché ------------------------------------------------------
  // Pour changer d'agenda, remplacer la valeur de SRC ci-dessous.
  var SRC = "azelartmarie@gmail.com";
  var TZ  = "Europe/Paris";

  // Vue liste sur petit écran (plus lisible), vue mois sur grand écran.
  // Pour forcer une vue, remplacer la ligne suivante par : var mode = "MONTH";
  var mode = (window.innerWidth < 600) ? "AGENDA" : "MONTH";

  document.getElementById("cal").src =
      "https://calendar.google.com/calendar/embed"
    + "?src=" + encodeURIComponent(SRC)
    + "&ctz=" + encodeURIComponent(TZ)
    + "&wkst=2"              // semaine commençant le lundi
    + "&mode=" + mode
    + "&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0";

  // ---- Outils --------------------------------------------------------------
  var barAndroid = document.getElementById("barAndroid");
  var barIOS     = document.getElementById("barIOS");

  function refused() {
    try { return localStorage.getItem("hintOff") === "1"; } catch (e) { return false; }
  }
  function refuse() {
    try { localStorage.setItem("hintOff", "1"); } catch (e) {}
  }
  function installed() {
    return window.navigator.standalone === true
        || window.matchMedia("(display-mode: standalone)").matches;
  }

  // ---- Android : le navigateur signale que la page est installable ---------
  // Chrome et Samsung Internet déclenchent "beforeinstallprompt". On empêche
  // leur propre bandeau (souvent jamais affiché) et on montre le nôtre.
  var invite = null;

  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    invite = e;
    if (!installed() && !refused()) barAndroid.classList.add("show");
  });

  document.getElementById("btnInstall").addEventListener("click", function () {
    if (!invite) { barAndroid.classList.remove("show"); return; }
    invite.prompt();                       // fenêtre d'installation du téléphone
    invite.userChoice.then(function () {
      invite = null;
      barAndroid.classList.remove("show"); // installé ou refusé : on n'insiste pas
    });
  });

  document.getElementById("btnNoAndroid").addEventListener("click", function () {
    barAndroid.classList.remove("show");
    refuse();
  });

  window.addEventListener("appinstalled", function () {
    barAndroid.classList.remove("show");
    refuse();
  });

  // ---- iPhone / iPad : guide manuel, seule voie possible -------------------
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
           || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

  if (isIOS && !installed() && !refused()) barIOS.classList.add("show");

  document.getElementById("btnNoIOS").addEventListener("click", function () {
    barIOS.classList.remove("show");
    refuse();
  });

  // ---- Service worker : requis pour que la page soit installable -----------
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }

})();
</script>

</body>
</html>
