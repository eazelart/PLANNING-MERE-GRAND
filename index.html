<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f4e79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Planning">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
  :root { --bg:#ffffff; --fg:#1b1b1b; --accent:#1f4e79; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#eaeaea; } }
  html, body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
               font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  #cal { position:fixed; inset:0; width:100%; height:100%; border:0; }
  #hint { position:fixed; left:0; right:0; bottom:0; z-index:10; display:none;
          background:var(--accent); color:#fff; padding:14px 16px calc(14px + env(safe-area-inset-bottom));
          font-size:15px; line-height:1.4; box-shadow:0 -2px 10px rgba(0,0,0,.25); }
  #hint b { font-weight:600; }
  #hint button { float:right; margin-left:12px; background:rgba(255,255,255,.2); color:#fff;
                 border:0; border-radius:6px; padding:8px 12px; font-size:15px; }
</style>
</head>
<body>

<iframe id="cal" title="Planning des visites" src="about:blank"
        frameborder="0" scrolling="no"></iframe>

<noscript>
  <iframe style="position:fixed;inset:0;width:100%;height:100%;border:0"
    src="https://calendar.google.com/calendar/embed?src=azelartmarie%40gmail.com&amp;ctz=Europe%2FParis&amp;wkst=2&amp;mode=MONTH&amp;showTitle=0&amp;showPrint=0&amp;showTabs=0&amp;showCalendars=0&amp;showTz=0"></iframe>
</noscript>

<div id="hint">
  <button type="button" id="hintClose">OK</button>
  Pour garder le planning&nbsp;: <b>Partager</b> puis <b>Sur l'écran d'accueil</b>.
</div>

<script>
(function () {
  // ---- Agenda affiché ------------------------------------------------------
  // Pour changer d'agenda, remplacer la valeur de SRC ci-dessous.
  var SRC = "azelartmarie@gmail.com";
  var TZ  = "Europe/Paris";

  // Vue liste sur petit écran (plus lisible), vue mois sur grand écran.
  // Pour forcer une vue, remplacer la ligne suivante par : var mode = "MONTH";
  var mode = (window.innerWidth < 600) ? "AGENDA" : "MONTH";

  var url = "https://calendar.google.com/calendar/embed"
          + "?src=" + encodeURIComponent(SRC)
          + "&ctz=" + encodeURIComponent(TZ)
          + "&wkst=2"              // semaine commençant le lundi
          + "&mode=" + mode
          + "&showTitle=0&showPrint=0&showTabs=0&showCalendars=0&showTz=0";

  document.getElementById("cal").src = url;

  // ---- Aide à l'installation, iPhone / iPad uniquement ---------------------
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
              || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var installed = window.navigator.standalone === true
              || window.matchMedia("(display-mode: standalone)").matches;
  var dismissed = false;
  try { dismissed = localStorage.getItem("hintOff") === "1"; } catch (e) {}

  if (isIOS && !installed && !dismissed) {
    document.getElementById("hint").style.display = "block";
  }
  document.getElementById("hintClose").addEventListener("click", function () {
    document.getElementById("hint").style.display = "none";
    try { localStorage.setItem("hintOff", "1"); } catch (e) {}
  });

  // ---- Service worker : requis par Chrome pour proposer l'installation -----
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>

</body>
</html>
